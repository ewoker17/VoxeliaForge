<!DOCTYPE html>
  <html>
    <head>
      <style>
        body {
          background: radial-gradient(circle, #1a1a2e, #0f0f1a);
          margin: 0;
      
       
          
        }
        h1 {
          font-size: 40px;
        }
        .topbar {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%; 
          height: 70px;

          display: flex; 
          justify-content: space-between; 
          align-items:  center;

          background: #111;
          color: white;
          padding: 0 20px;

          z-index: 1000;
        }
        .center {
          height: 100vh;
          
          display: flex;
          flex-direction: row;
          justify-content: center;
          align-items: center;

          gap: 15px;
        }
        button {
          width: 170px; 
          height: 170px;
          
          padding: 12px 20px; 
          border: none; 
          border-radius: 20px; 
          cursor: pointer;
          background: #4f46e5; 
          color: white;
        }
        button:hover {
          background: #6366f1;
        }
          .signup-login {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
          }
      </style>
    </head>
      <body>
        <div class="topbar">
        <h2>VoxeliaForge</h2>
        </div>
        <div class="center">
          <button>VoxeliaForge Main</button>
          <button>VoxeliaForge Kids</button>
          <button>Add profile</button>
        </div>
        <div class="Sign up/login">
          <button>Sign up</button>
          <button>Login</button>
        </div>
      </body>
  </html>
