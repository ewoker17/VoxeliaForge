<!DOCTYPE html>
  <html>
    <head>
      <style>
    body {
      background: radial-gradient(circle, #1a1a2e, #0f0f1a);
      margin: 0; 



        }
     .topbar {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%; 
          height: 70px;

          display: flex; 
          justify-content: space-between; 
          align-items:  center;

          background: #111;
          color: white;
          padding: 0 20px;

          z-index: 1000;
        }
        .sidebar {
          position: fixed;
          top: 70px; 
          left: 0;
          width: 200px; 
          height: calc(100vh - 70px); 

          background: #111;
          color: rgb(19, 2, 2);
          padding: 20px;

          z-index: 999;
        }
  </style>
  </head>
  <body>
    <div class="topbar">
    </div>
    <div class="sidebar">
    </div>
  </body>
</html>
